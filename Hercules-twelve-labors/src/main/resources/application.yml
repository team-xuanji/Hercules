SERVICE_NAME: hercules-twelve-labors
API_VERSION: v1

server:
  port: 8080
  servlet:
    context-path: /${SERVICE_NAME}/${API_VERSION}
#    context-path: /etlJobManager/v1
#spring
spring:
#  profiles:
#      active: qa
  main:
    allow-bean-definition-overriding: true
#  profiles:
#    include: http,rabbit,server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      auto-commit: true
      idle-timeout: 60000
      pool-name: HerculesHikariCP
      max-lifetime: 600000
      connection-timeout: 30000
      connection-test-query: SELECT 1
#    schema: classpath:init.sql
#    initialization-mode: always
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: NON_NULL
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB


#mybatis
mybatis-plus:
  mapper-locations: classpath:/mapper/*Mapper.xml
  # Entity scanning, multiple packages separated by commas or semicolons
  typeAliasesPackage: team.magic.flute.hercules.manager.dao.po
  global-config:
    # Refresh mapper debugging tool
    db-config:
      # Primary key type 0:"Database ID auto-increment", 1:"User input ID", 2:"Global unique ID (numeric type unique ID)", 3:"Global unique ID UUID";
      id-type: AUTO
      logic-delete-value: Y
      logic-not-delete-value: N
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

feign:
  retry:
    maxAttempts: 5
    period: 100
    maxPeriod: 1000

